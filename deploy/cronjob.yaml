apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoecon-daily
  namespace: hussein-ns
spec:
  # 01:00 start so the brief lands in the inbox by ~07:00: a healthy deepseek
  # run takes 3-5h of sequential LLM calls (gate ~1h + synthesis ~2-3h), so a
  # 07:00 start delivered mid-day and left no headroom before the hang-guard
  # (2026-07-09: run 43 killed at 93% of synthesis by the old 4h deadline).
  schedule: "0 1 * * *"
  timeZone: "Europe/Prague"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Hang-guard: fail a run that exceeds 5.5h instead of letting it run for
      # many hours and (with concurrencyPolicy: Forbid) block the next day's run.
      # 2026-07-29: was 28800 (8h), which from a 23:00Z start fired at 07:00Z =
      # 09:00 Prague — TWO HOURS AFTER the 07:00 delivery target, so it could
      # never protect a send (run 67 hung 6h50m and the guard never helped).
      # 19800 (5.5h) fires 04:30Z / 06:30 Prague, 30 min before delivery.
      # Healthy runs are 19-137 min, so the margin is still ~2.4x the worst.
      activeDeadlineSeconds: 19800
      template:
        metadata:
          labels: { app: geoecon }
        spec:
          # 2026-07-29: was OnFailure. With OnFailure the SAME pod is recycled
          # in place and the job controller DELETES it once backoffLimit is
          # exhausted — so when runs 69/70/71 were hard-killed (uncatchable
          # SIGKILL, no alert, no stage error row) the pod, its termination
          # reason (OOMKilled vs Evicted vs Error) and all three attempts' logs
          # were destroyed before anyone could look. `Never` gives each attempt
          # its own pod and RETAINS the failed ones, so the next occurrence is
          # diagnosable from `kubectl get pods` + `kubectl logs` alone.
          restartPolicy: Never
          # Give the SIGTERM alert email time to finish sending before SIGKILL:
          # when activeDeadlineSeconds fires, the handler does a blocking SMTP
          # send (30s socket timeout) and k8s' default 30s grace can cut it off.
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pipeline
              # keep in lockstep with watchdog-cronjob.yaml — both need the same
              # alert-code image (the in-process alert hooks live here; tag skew
              # would silently ship a watchdog-only alert layer).
              image: jalalhussein/geoecon-pipeline:20260729-2
              args: ["run"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              envFrom:
                - secretRef: { name: geoecon-secrets }
              env:
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: geoecon-db-app, key: username } }
                - name: DB_PASS
                  valueFrom: { secretKeyRef: { name: geoecon-db-app, key: password } }
                - name: DB_DSN
                  value: "postgresql://$(DB_USER):$(DB_PASS)@geoecon-db-rw:5432/geoeconomics"
                # absolute path to the shipped registry (Dockerfile COPY config),
                # so resolution does not depend on import location / CWD.
                - name: SOURCES_PATH
                  value: "/app/config/sources.yaml"
                # Change 4 ranking switch stays OFF until live calibration (see memory).
                - name: RANK_BY_CORROBORATION
                  value: "false"
                # Curated named-source nudge (economy-first + curated preference).
                # Shipped ON from 20260624-1; small additive boosts, market-demote still wins.
                # Set "false" to revert ranking to byte-identical prior behavior.
                - name: CURATED_PREFERENCE
                  value: "true"
                # Per-country slot cap: no country takes >4 of a region's 12 slots
                # (backfills if supply is thin). Shipped ON from 20260624-2.
                # Set "0" to disable -> ranking byte-identical to pre-cap.
                - name: COUNTRY_CAP
                  value: "4"
                # Discovery redesign (spec 2026-07-04): Google News search spine
                # (42 countries x 2 keyword families); retired tier-1/2 registry
                # outlets skip while this is on. Staged flip DEFERRED 2026-07-08 —
                # the alert-layer deploy (20260708-1) ships alone so behavior
                # changes are attributable. Set "true" to flip phase-4 on.
                - name: SEARCH_DISCOVERY
                  value: "false"
                # GDELT stays on the legacy GKG-file path: the DOC 2.0 API could
                # not be validated (soft-block/429 from both dev and cluster IPs,
                # 2026-07-04). Flip to "docapi" only after a clean live probe.
                - name: GDELT_MODE
                  value: "gkg"
                # LLM model per stage. deepseek (non-reasoning) is what the prompts
                # and parsers were tuned for: ~2s/call, clean JSON. A prior live
                # "modelfix" repointed these to kimi-k2.6 (a reasoning model) whose
                # ~100s/synthesis-call made runs take 9-18h and miss the daily send;
                # reverted to deepseek 2026-07-07. Change here to swap the model.
                #
                # 2026-07-28: TEMPORARY swap to gemma4 — the upstream deepseek vLLM
                # backend is down (frps-proxy-tunnel.vllm-ns unreachable -> HTTP 500
                # on every call), which silently burned run 67 (all 1602 articles
                # dropped unjudged, no brief). gemma4 was picked on measurements, not
                # vibes: 95% gate agreement with deepseek on run-66 ground truth
                # (27/30 of its keeps, 0 extra keeps), non-reasoning (0 reasoning
                # tokens, unlike kimi/glm-5/qwen3.5), 0 unparsed. Live run 68 with it:
                # 317/1593 kept (19.9% vs deepseek's 21.8%), 183/196 synthesis records
                # ok (93% vs run 66's 61%). Cost: synthesis 33min vs 8min.
                # REVERT to deepseek once e-INFRA restores the tunnel.
                #
                # 2026-07-29 02:18Z re-probe: deepseek is still down and has in
                # fact degraded — it now returns HTTP 400 "litellm.BadRequestError:
                # You passed in model=deepseek-v4-pro. There are no healthy
                # deployments for this model", i.e. the backend is fully
                # deregistered rather than merely unreachable (was 500 on 07-28).
                # Note 400 is NOT in LLMClient.RETRYABLE, so it now fails fast
                # instead of hanging — but it still fails. gemma4 answered in
                # 0.3s with 0 reasoning tokens. kimi/glm-5/qwen3.5 are up but are
                # reasoning models (empty content + reasoning_tokens) and are not
                # drop-in. Keep gemma4; re-probe before reverting.
                - name: GATE_MODEL
                  value: "gemma4"
                - name: SYNTHESIS_MODEL
                  value: "gemma4"
                - name: DEDUP_MODEL
                  value: "gemma4"
              resources:
                # 4Gi limit: 2026-07-09 attempt 1 (run 42) died with an
                # uncatchable SIGKILL during extraction — no error row, no crash
                # email — consistent with an OOM-kill at the old 2Gi limit.
                #
                # 2026-07-29: request 2Gi -> 3Gi, limit 4Gi -> 6Gi.
                # Measured on run 72 (1597 articles, same image/env): the pod
                # sits at ~1.95Gi from the end of discovery onward and extraction
                # only adds ~120Mi (peak 1.96Gi). Usage therefore sat AT/ABOVE the
                # old 2Gi request, which put the pod in kubelet's node-pressure
                # eviction set (QoS Burstable is ranked by usage-above-request).
                # A 3Gi request keeps steady-state comfortably BELOW the request
                # so the pod is protected rather than a first-choice eviction
                # victim; 6Gi limit keeps spike headroom without hoarding quota
                # (ns quota: limits.memory 8Gi used / 24Gi hard).
                requests: { cpu: "1", memory: "3Gi" }
                limits: { cpu: "2", memory: "6Gi" }
              volumeMounts:
                - { name: archive, mountPath: /data/archive }
          volumes:
            - name: archive
              persistentVolumeClaim: { claimName: geoecon-archive }
