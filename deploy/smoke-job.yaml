# One-off smoke test — discovery redesign Phase 4 (search spine flags-on).
#
# Mirrors the daily CronJob's pod exactly, but DRY_RUN=true (renders + writes the
# archive HTML, sends NO email) and SEARCH_DISCOVERY=true (the new Google News
# search spine; retired registry outlets skip). GDELT_MODE stays gkg until the
# DOC API is validated from the cluster IP. DRY_RUN means seen_events is NOT
# touched, so this cannot suppress events for the real daily run.
#
# Usage:
#   kubectl apply -f deploy/smoke-job.yaml
#   kubectl -n hussein-ns logs -f job/geoecon-smoke
#   # inspect: runs.metrics in Postgres, archive HTML on the PVC, and logs for
#   #   - discovery_search: search_discovered > 0, search_per_provider,
#   #     search_decode_failures (Google News URL decode health — watch this),
#   #     search_feeds_failed / search_feeds_empty
#   #   - registry_skipped_retired: 28 (trim active with flag on)
#   #   - gate_unparsed_dropped (new cascade telemetry; expect ~0)
#   #   - extraction wall-clock (EXTRACT_WORKERS=12 now parallel)
#   # re-run: kubectl -n hussein-ns delete job geoecon-smoke   (then apply again)
apiVersion: batch/v1
kind: Job
metadata:
  name: geoecon-smoke
  namespace: hussein-ns
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600   # auto-clean an hour after it finishes
  template:
    metadata:
      labels: { app: geoecon, run: smoke }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pipeline
          image: jalalhussein/geoecon-pipeline:20260704-2
          args: ["run"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          envFrom:
            - secretRef: { name: geoecon-secrets }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: geoecon-db-app, key: username } }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: geoecon-db-app, key: password } }
            - name: DB_DSN
              value: "postgresql://$(DB_USER):$(DB_PASS)@geoecon-db-rw:5432/geoeconomics"
            - name: SOURCES_PATH
              value: "/app/config/sources.yaml"
            - name: RANK_BY_CORROBORATION
              value: "false"
            # Curated named-source nudge — shipped ON from 20260624-1 (see cronjob.yaml).
            - name: CURATED_PREFERENCE
              value: "true"
            # Per-country slot cap (max 4 per country per region) — ON from 20260624-2.
            - name: COUNTRY_CAP
              value: "4"
            # --- smoke-only overrides ---
            - name: DRY_RUN
              value: "true"          # render + archive, but do NOT send email
            - name: LIMIT
              value: "30"            # caps GDELT per-bucket ceiling AND search per-feed budget (min with SEARCH_COUNTRY_CAP)
            # --- Phase-4 flags under test ---
            - name: SEARCH_DISCOVERY
              value: "true"          # Google News search spine ON (registry trim activates)
            - name: GDELT_MODE
              value: "gkg"           # flip to docapi only after cluster-IP DOC validation
          resources:
            requests: { cpu: "1", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
          volumeMounts:
            - { name: archive, mountPath: /data/archive }
      volumes:
        - name: archive
          persistentVolumeClaim: { claimName: geoecon-archive }
