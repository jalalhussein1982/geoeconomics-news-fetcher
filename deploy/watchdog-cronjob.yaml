apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoecon-watchdog
  namespace: hussein-ns
spec:
  # Dead-man's switch for geoecon-daily (01:00): a healthy 3-5h run has sent
  # by ~06:00, so at 07:30 — when the user expects the brief — silence means
  # sent. Fires on: no run row, run still running (late; the 8h deadline kills
  # at 09:00), or completed-but-unsent. If no run completed AND sent today,
  # this emails an alert.
  schedule: "30 7 * * *"
  timeZone: "Europe/Prague"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          # app: geoecon is REQUIRED — geoecon-db-netpol admits only that label
          # to Postgres:5432 (2026-07-08 probe with a different label timed out
          # on DB connect). role: watchdog distinguishes these pods in queries.
          labels: { app: geoecon, role: watchdog }
        spec:
          restartPolicy: OnFailure
          # Give the alert email time to finish sending before SIGKILL (SMTP
          # socket timeout is 30s per call; k8s default grace is only 30s).
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: watchdog
              image: jalalhussein/geoecon-pipeline:20260729-1
              args: ["watchdog"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              envFrom:
                - secretRef: { name: geoecon-secrets }
              env:
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: geoecon-db-app, key: username } }
                - name: DB_PASS
                  valueFrom: { secretKeyRef: { name: geoecon-db-app, key: password } }
                - name: DB_DSN
                  value: "postgresql://$(DB_USER):$(DB_PASS)@geoecon-db-rw:5432/geoeconomics"
              resources:
                requests: { cpu: "100m", memory: "128Mi" }
                limits: { cpu: "250m", memory: "256Mi" }
