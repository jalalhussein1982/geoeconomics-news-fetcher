apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoecon-daily
  namespace: hussein-ns
spec:
  schedule: "0 7 * * *"
  timeZone: "Europe/Prague"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: geoecon }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pipeline
              image: jalalhussein/geoecon-pipeline:20260703-1
              args: ["run"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              envFrom:
                - secretRef: { name: geoecon-secrets }
              env:
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: geoecon-db-app, key: username } }
                - name: DB_PASS
                  valueFrom: { secretKeyRef: { name: geoecon-db-app, key: password } }
                - name: DB_DSN
                  value: "postgresql://$(DB_USER):$(DB_PASS)@geoecon-db-rw:5432/geoeconomics"
                # absolute path to the shipped registry (Dockerfile COPY config),
                # so resolution does not depend on import location / CWD.
                - name: SOURCES_PATH
                  value: "/app/config/sources.yaml"
                # Change 4 ranking switch stays OFF until live calibration (see memory).
                - name: RANK_BY_CORROBORATION
                  value: "false"
                # Curated named-source nudge (economy-first + curated preference).
                # Shipped ON from 20260624-1; small additive boosts, market-demote still wins.
                # Set "false" to revert ranking to byte-identical prior behavior.
                - name: CURATED_PREFERENCE
                  value: "true"
                # Per-country slot cap: no country takes >4 of a region's 12 slots
                # (backfills if supply is thin). Shipped ON from 20260624-2.
                # Set "0" to disable -> ranking byte-identical to pre-cap.
                - name: COUNTRY_CAP
                  value: "4"
              resources:
                requests: { cpu: "1", memory: "1Gi" }
                limits: { cpu: "2", memory: "2Gi" }
              volumeMounts:
                - { name: archive, mountPath: /data/archive }
          volumes:
            - name: archive
              persistentVolumeClaim: { claimName: geoecon-archive }
