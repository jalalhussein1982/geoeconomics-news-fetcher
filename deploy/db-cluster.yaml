apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: geoecon-db
  namespace: hussein-ns
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 5Gi
    storageClass: nfs-csi
  bootstrap:
    initdb:
      database: geoeconomics
      owner: geoecon
      # Schema is NOT bootstrapped here. The application owns migrations:
      # geoecon/state/db.apply_migrations() applies geoecon/state/migrations/*.sql
      # (idempotent, tracked in schema_migrations) on startup, connecting AS the
      # geoecon role — so the tables are geoecon-owned and writable. Bootstrapping
      # via postInitApplicationSQL would create postgres-owned tables the app
      # cannot write to.
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "1Gi" }
