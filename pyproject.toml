[project]
name = "geoecon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "trafilatura>=1.8",
    "Jinja2>=3.1",
    "feedparser>=6.0",
    "cssselect>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "aiosmtpd>=1.4", "ruamel.yaml>=0.18"]  # ruamel: tools/registry_apply.py

[project.scripts]
geoecon = "geoecon.orchestrator:main"

[tool.pytest.ini_options]
markers = ["requires_db: needs TEST_DATABASE_URL", "requires_net: hits live network"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geoecon*"]

[tool.setuptools.package-data]
geoecon = ["prompts/*.txt", "render/templates/*.j2", "state/migrations/*.sql"]
