apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoecon-daily
  namespace: hussein-ns
spec:
  schedule: "0 7 * * *"
  timeZone: "Europe/Prague"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Hang-guard: fail a run that exceeds 4h instead of letting it run for many
      # hours and (with concurrencyPolicy: Forbid) block the next day's run. A
      # healthy deepseek run finishes in ~1h; this bounds a degraded LLM backend.
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels: { app: geoecon }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pipeline
              image: jalalhussein/geoecon-pipeline:20260704-2
              args: ["run"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              envFrom:
                - secretRef: { name: geoecon-secrets }
              env:
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: geoecon-db-app, key: username } }
                - name: DB_PASS
                  valueFrom: { secretKeyRef: { name: geoecon-db-app, key: password } }
                - name: DB_DSN
                  value: "postgresql://$(DB_USER):$(DB_PASS)@geoecon-db-rw:5432/geoeconomics"
                # absolute path to the shipped registry (Dockerfile COPY config),
                # so resolution does not depend on import location / CWD.
                - name: SOURCES_PATH
                  value: "/app/config/sources.yaml"
                # Change 4 ranking switch stays OFF until live calibration (see memory).
                - name: RANK_BY_CORROBORATION
                  value: "false"
                # Curated named-source nudge (economy-first + curated preference).
                # Shipped ON from 20260624-1; small additive boosts, market-demote still wins.
                # Set "false" to revert ranking to byte-identical prior behavior.
                - name: CURATED_PREFERENCE
                  value: "true"
                # Per-country slot cap: no country takes >4 of a region's 12 slots
                # (backfills if supply is thin). Shipped ON from 20260624-2.
                # Set "0" to disable -> ranking byte-identical to pre-cap.
                - name: COUNTRY_CAP
                  value: "4"
                # Discovery redesign (spec 2026-07-04), ON from 20260704-2:
                # Google News search spine (42 countries x 2 keyword families);
                # retired tier-1/2 registry outlets skip while this is on.
                # Set "false" to revert to the pre-redesign pipeline wholesale.
                - name: SEARCH_DISCOVERY
                  value: "true"
                # GDELT stays on the legacy GKG-file path: the DOC 2.0 API could
                # not be validated (soft-block/429 from both dev and cluster IPs,
                # 2026-07-04). Flip to "docapi" only after a clean live probe.
                - name: GDELT_MODE
                  value: "gkg"
                # LLM model per stage. deepseek (non-reasoning) is what the prompts
                # and parsers were tuned for: ~2s/call, clean JSON. A prior live
                # "modelfix" repointed these to kimi-k2.6 (a reasoning model) whose
                # ~100s/synthesis-call made runs take 9-18h and miss the daily send;
                # reverted to deepseek 2026-07-07. Change here to swap the model.
                - name: GATE_MODEL
                  value: "deepseek"
                - name: SYNTHESIS_MODEL
                  value: "deepseek"
                - name: DEDUP_MODEL
                  value: "deepseek"
              resources:
                requests: { cpu: "1", memory: "1Gi" }
                limits: { cpu: "2", memory: "2Gi" }
              volumeMounts:
                - { name: archive, mountPath: /data/archive }
          volumes:
            - name: archive
              persistentVolumeClaim: { claimName: geoecon-archive }
