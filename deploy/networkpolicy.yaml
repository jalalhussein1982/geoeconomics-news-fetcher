apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geoecon-db-netpol
  namespace: hussein-ns
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: geoecon-db }
  policyTypes: ["Ingress"]
  ingress:
    # the pipeline pods (CronJob/one-shot) reach Postgres
    - from:
        - podSelector:
            matchLabels: { app: geoecon }
      ports:
        - { protocol: TCP, port: 5432 }
    # the CloudNativePG operator manages the instance (status/metrics/etc.);
    # allow all ports from its namespace so the NetworkPolicy can't strangle it
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cloudnativepg }
