apiVersion: v1
kind: Secret
metadata:
  name: geoecon-secrets
  namespace: hussein-ns
type: Opaque
stringData:
  MAETCENTRUM_KEY: "REPLACE"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "REPLACE@gmail.com"
  SMTP_PASSWORD: "REPLACE_APP_PASSWORD"
